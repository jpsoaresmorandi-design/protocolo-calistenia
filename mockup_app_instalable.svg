<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="appBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="60%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="titaniumPhone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="phoneShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="8" dy="20" stdDeviation="22" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#appBg)"/>

  <!-- Tactical Grid -->
  <path d="M0 200 H800 M0 400 H800 M200 0 V600 M400 0 V600 M600 0 V600" stroke="rgba(16,185,129,0.05)" stroke-width="1"/>

  <!-- Smartphone Mockup -->
  <g filter="url(#phoneShadow)" transform="translate(160, 45)">
    <!-- Outer Titanium Rim -->
    <rect x="0" y="0" width="260" height="510" rx="36" fill="url(#titaniumPhone)" stroke="#475569" stroke-width="2"/>
    <!-- Screen Bezel -->
    <rect x="8" y="8" width="244" height="494" rx="30" fill="#030712"/>

    <!-- Dynamic Island / Speaker -->
    <rect x="90" y="16" width="80" height="18" rx="9" fill="#000000"/>
    <circle cx="156" cy="25" r="4" fill="#1e293b"/>

    <!-- App Content Inside Phone -->
    <g transform="translate(20, 50)">
      <!-- App Header -->
      <text x="110" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="800" fill="#10b981" letter-spacing="2">APP TÁCTICA OFICIAL</text>
      
      <!-- Big App Icon Badge -->
      <g transform="translate(110, 85)">
        <rect x="-42" y="-42" width="84" height="84" rx="20" fill="#0b1120" stroke="url(#neonGlow)" stroke-width="2.5"/>
        <polygon points="0,-22 18,0 0,22 -18,0" fill="url(#neonGlow)"/>
        <polygon points="0,-12 10,0 0,12 -10,0" fill="#0b1120"/>
      </g>

      <!-- App Title -->
      <text x="110" y="152" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="900" fill="#ffffff">PROTOCOLO</text>
      <text x="110" y="170" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="800" fill="#10b981">CALISTENIA MILITAR</text>

      <!-- Install Status Badge -->
      <g transform="translate(110, 205)">
        <rect x="-85" y="-14" width="170" height="28" rx="14" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="1"/>
        <text x="0" y="4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#10b981">✓ INSTALABLE EN 1 CLIC</text>
      </g>

      <!-- Mini Feature Cards -->
      <g transform="translate(10, 235)">
        <rect x="0" y="0" width="200" height="42" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="14" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#94a3b8">COMPATIBILIDAD</text>
        <text x="14" y="32" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#ffffff">Android, iOS, iPad &amp; PC</text>

        <rect x="0" y="50" width="200" height="42" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="14" y="68" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#94a3b8">MODO DE ACCESO</text>
        <text x="14" y="82" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#ffffff">Sin Tiendas • Acceso Directo</text>

        <rect x="0" y="100" width="200" height="42" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="14" y="118" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#94a3b8">SIN MENSUALIDADES</text>
        <text x="14" y="132" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#10b981">Acceso de por Vida 24/7</text>
      </g>

      <!-- Bottom Home Bar -->
      <rect x="55" y="420" width="110" height="4" rx="2" fill="#475569"/>
    </g>
  </g>

  <!-- Right Floating Badge: "ACCESO ILIMITADO" -->
  <g filter="url(#phoneShadow)" transform="translate(450, 160)">
    <!-- Security Card Base -->
    <rect x="0" y="0" width="270" height="280" rx="18" fill="#0b1120" stroke="rgba(16,185,129,0.3)" stroke-width="2"/>
    
    <!-- Chip Icon -->
    <rect x="24" y="24" width="42" height="32" rx="6" fill="#ca8a04" stroke="#fef08a" stroke-width="1"/>
    <line x1="24" y1="40" x2="66" y2="40" stroke="#854d0e" stroke-width="1"/>
    <line x1="45" y1="24" x2="45" y2="56" stroke="#854d0e" stroke-width="1"/>

    <!-- Text Info -->
    <text x="24" y="88" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="800" fill="#10b981" letter-spacing="2">CREDENCIAL TÁCTICA</text>
    <text x="24" y="114" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="900" fill="#ffffff">ACCESO TOTAL</text>
    <text x="24" y="134" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="800" fill="#e2e8f0">E ILIMITADO</text>

    <line x1="24" y1="152" x2="246" y2="152" stroke="#1e293b" stroke-width="1"/>

    <text x="24" y="176" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#94a3b8">TIPO DE MEMBRESÍA:</text>
    <text x="24" y="194" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#10b981">PAGO ÚNICO • VITALICIO</text>

    <!-- Inclusion Tag -->
    <g transform="translate(24, 218)">
      <rect x="0" y="0" width="222" height="34" rx="8" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="1.5"/>
      <text x="111" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="#34d399">¡INCLUIDO DESDE EL PACK BÁSICO!</text>
    </g>
  </g>
</svg>
