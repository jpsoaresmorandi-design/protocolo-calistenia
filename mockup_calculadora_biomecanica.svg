<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="calcBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="60%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#calcBg)"/>

  <!-- Tactical Grid -->
  <path d="M0 150 H800 M0 300 H800 M0 450 H800 M200 0 V600 M400 0 V600 M600 0 V600" stroke="rgba(56,189,248,0.04)" stroke-width="1"/>

  <!-- Device Container (Tablet / Scanner UI) -->
  <g filter="url(#cardShadow)" transform="translate(150, 40)">
    <!-- Device Frame -->
    <rect x="0" y="0" width="500" height="520" rx="24" fill="#090d16" stroke="#1e293b" stroke-width="3"/>
    
    <!-- Top Notch & Camera -->
    <circle cx="250" cy="18" r="5" fill="#1e293b"/>
    <circle cx="250" cy="18" r="2.5" fill="#0f172a"/>

    <!-- Screen Glass Area -->
    <rect x="16" y="36" width="468" height="466" rx="16" fill="#030712"/>

    <!-- Header Bar -->
    <g transform="translate(36, 60)">
      <rect x="0" y="0" width="428" height="34" rx="8" fill="#0f172a" stroke="rgba(16,185,129,0.2)" stroke-width="1"/>
      <circle cx="18" cy="17" r="4" fill="#10b981"/>
      <text x="32" y="21" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="800" fill="#f8fafc" letter-spacing="1">CALCULADORA BIOMECÁNICA TÁCTICA</text>
      <text x="410" y="21" text-anchor="end" font-family="'Courier New', monospace" font-size="10" font-weight="700" fill="#38bdf8">V2.4 ÉLITE</text>
    </g>

    <!-- Main Circular Dial (Body Fat & Metabolism) -->
    <g transform="translate(250, 190)">
      <!-- Outer Track -->
      <circle cx="0" cy="0" r="75" fill="none" stroke="#1e293b" stroke-width="12"/>
      <!-- Active Progress -->
      <circle cx="0" cy="0" r="75" fill="none" stroke="url(#neonGreen)" stroke-width="12" stroke-dasharray="471" stroke-dashoffset="130" stroke-linecap="round" transform="rotate(-90)"/>
      
      <!-- Inner Reading -->
      <text x="0" y="-12" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">CALORÍAS DIARIAS</text>
      <text x="0" y="20" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="900" fill="#ffffff">2,150</text>
      <text x="0" y="38" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="800" fill="#10b981">DÉFICIT QUEMA TÁCTICO</text>
    </g>

    <!-- Macro Breakdown Cards -->
    <g transform="translate(36, 290)">
      <!-- Protein Card -->
      <rect x="0" y="0" width="134" height="68" rx="10" fill="#0f172a" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
      <text x="14" y="22" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#10b981">PROTEÍNA (2.2g/kg)</text>
      <text x="14" y="46" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#ffffff">165g</text>
      <rect x="14" y="54" width="106" height="4" rx="2" fill="#1e293b"/>
      <rect x="14" y="54" width="92" height="4" rx="2" fill="url(#neonGreen)"/>

      <!-- Carbs Card -->
      <rect x="146" y="0" width="134" height="68" rx="10" fill="#0f172a" stroke="rgba(56,189,248,0.3)" stroke-width="1"/>
      <text x="160" y="22" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#38bdf8">CARBOHIDRATOS</text>
      <text x="160" y="46" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#ffffff">180g</text>
      <rect x="160" y="54" width="106" height="4" rx="2" fill="#1e293b"/>
      <rect x="160" y="54" width="70" height="4" rx="2" fill="url(#cyanAccent)"/>

      <!-- Fats Card -->
      <rect x="292" y="0" width="134" height="68" rx="10" fill="#0f172a" stroke="rgba(234,179,8,0.3)" stroke-width="1"/>
      <text x="306" y="22" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#eab308">GRASAS SALUDABLES</text>
      <text x="306" y="46" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#ffffff">55g</text>
      <rect x="306" y="54" width="106" height="4" rx="2" fill="#1e293b"/>
      <rect x="306" y="54" width="55" height="4" rx="2" fill="#eab308"/>
    </g>

    <!-- Calibration / Metabolic Target Bar -->
    <g transform="translate(36, 375)">
      <rect x="0" y="0" width="428" height="48" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="28" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">OBJETIVO: <strong fill="#fff">Pérdida de Grasa sin Perder Músculo</strong></text>
      <rect x="330" y="12" width="82" height="24" rx="6" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="1"/>
      <text x="371" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#10b981">OPTIMIZADO</text>
    </g>

    <!-- Action Button inside Screen -->
    <g transform="translate(36, 440)">
      <rect x="0" y="0" width="428" height="44" rx="10" fill="url(#neonGreen)"/>
      <text x="214" y="27" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="900" fill="#022c22" letter-spacing="1">CALCULAR MI AJUSTE SEMANAL</text>
    </g>
  </g>
</svg>
