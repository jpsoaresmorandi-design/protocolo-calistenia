<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <radialGradient id="masterBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="goldM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="neonM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="bundleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="1000" height="650" fill="url(#masterBg)"/>

  <!-- Tactical Hex / Grid -->
  <path d="M0 200 H1000 M0 400 H1000 M250 0 V650 M500 0 V650 M750 0 V650" stroke="rgba(16,185,129,0.04)" stroke-width="1"/>

  <!-- Master Composition -->
  <g filter="url(#bundleShadow)" transform="translate(60, 40)">

    <!-- 1. Left: Guía Táctica Dossier -->
    <g transform="translate(40, 60) rotate(-6)">
      <rect x="0" y="0" width="220" height="320" rx="10" fill="#0f172a" stroke="#334155" stroke-width="2"/>
      <rect x="12" y="12" width="196" height="296" rx="6" fill="#0b1120" stroke="rgba(234,179,8,0.4)" stroke-width="1.5"/>
      <polygon points="12,12 36,12 12,36" fill="url(#goldM)"/>
      <polygon points="208,12 184,12 208,36" fill="url(#goldM)"/>
      <text x="110" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="800" fill="#10b981" letter-spacing="2">SISTEMA TÁCTICO</text>
      <text x="110" y="80" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff">GUÍA TÁCTICA</text>
      <text x="110" y="100" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="800" fill="url(#goldM)">OPERACIONES</text>
      <circle cx="110" cy="160" r="32" fill="#111827" stroke="url(#goldM)" stroke-width="1.5"/>
      <path d="M96 155 L110 168 L124 155 M96 148 L110 161 L124 148" fill="none" stroke="url(#neonM)" stroke-width="3" stroke-linecap="round"/>
      <text x="110" y="225" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#94a3b8">• 21 Días de Choque</text>
      <text x="110" y="242" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#94a3b8">• Mapas Musculares</text>
      <rect x="30" y="270" width="160" height="20" rx="10" fill="url(#neonM)"/>
      <text x="110" y="284" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="900" fill="#022c22">ORDEN OFICIAL</text>
    </g>

    <!-- 2. Center Background: Certificado Oficial Táctico -->
    <g transform="translate(230, 20)">
      <rect x="0" y="0" width="400" height="300" rx="8" fill="#080e1a" stroke="url(#goldM)" stroke-width="2.5"/>
      <rect x="8" y="8" width="384" height="284" rx="4" fill="none" stroke="rgba(234,179,8,0.3)" stroke-width="1" stroke-dasharray="4 2"/>
      <text x="200" y="45" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="800" fill="#10b981" letter-spacing="3">REPÚBLICA FUERZAS TÁCTICAS</text>
      <text x="200" y="75" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="900" fill="url(#goldM)">CERTIFICADO OFICIAL</text>
      <text x="200" y="94" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="800" fill="#ffffff">GRADUACIÓN 21 DÍAS MILITAR</text>
      <line x1="120" y1="106" x2="280" y2="106" stroke="url(#goldM)" stroke-width="1"/>
      <text x="200" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#94a3b8">Acredita dominio total de fuerza relativa y disciplina</text>
      <!-- Seal -->
      <circle cx="330" cy="220" r="28" fill="url(#goldM)"/>
      <circle cx="330" cy="220" r="24" fill="#713f12"/>
      <polygon points="330,208 333,217 342,217 335,223 338,232 330,226 322,232 325,223 318,217 327,217" fill="url(#goldM)"/>
      <!-- ID -->
      <text x="80" y="240" font-family="'Courier New', monospace" font-size="8" font-weight="700" fill="#10b981">REG: #PCM-2026-VIP</text>
    </g>

    <!-- 3. Center Foreground: iPhone 15 Pro Workout Player -->
    <g transform="translate(350, 110)">
      <rect x="0" y="0" width="190" height="380" rx="30" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
      <rect x="6" y="6" width="178" height="368" rx="26" fill="#030712"/>
      <!-- Island -->
      <rect x="65" y="12" width="60" height="14" rx="7" fill="#000"/>
      <!-- Screen UI -->
      <text x="95" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="800" fill="#10b981">ENTRENAMIENTO EN VIVO</text>
      <!-- Timer -->
      <circle cx="95" cy="115" r="46" fill="none" stroke="#1e293b" stroke-width="8"/>
      <circle cx="95" cy="115" r="46" fill="none" stroke="url(#neonM)" stroke-width="8" stroke-dasharray="289" stroke-dashoffset="70" transform="rotate(-90 95 115)"/>
      <text x="95" y="124" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="900" fill="#fff">00:45</text>
      <!-- Ex Name -->
      <text x="95" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="#fff">FLEXIONES DIAMANTE</text>
      <text x="95" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#94a3b8">Serie 3/4 • 12 Reps</text>
      <!-- Action Button -->
      <rect x="25" y="235" width="140" height="28" rx="8" fill="url(#neonM)"/>
      <text x="95" y="253" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="900" fill="#022c22">COMPLETAR SERIE ✓</text>
      <!-- Bottom Bar -->
      <rect x="50" y="354" width="90" height="4" rx="2" fill="#475569"/>
    </g>

    <!-- 4. Right: Calculadora & Escáner Biomecánico -->
    <g transform="translate(560, 100) rotate(5)">
      <rect x="0" y="0" width="220" height="310" rx="14" fill="#090d16" stroke="#1e293b" stroke-width="2"/>
      <rect x="8" y="8" width="204" height="294" rx="10" fill="#030712"/>
      <text x="110" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="800" fill="#38bdf8" letter-spacing="1">CALCULADORA TÁCTICA</text>
      <!-- Mini Dial -->
      <circle cx="110" cy="85" r="32" fill="none" stroke="#1e293b" stroke-width="6"/>
      <circle cx="110" cy="85" r="32" fill="none" stroke="url(#neonM)" stroke-width="6" stroke-dasharray="201" stroke-dashoffset="50" transform="rotate(-90 110 85)"/>
      <text x="110" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#fff">2,150</text>
      <text x="110" y="103" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" font-weight="800" fill="#10b981">DÉFICIT QUEMA</text>
      <!-- Macros -->
      <g transform="translate(18, 130)">
        <rect x="0" y="0" width="184" height="28" rx="6" fill="#0f172a"/>
        <text x="10" y="18" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#fff">Proteína: <tspan fill="#10b981">165g</tspan></text>
        <rect x="0" y="34" width="184" height="28" rx="6" fill="#0f172a"/>
        <text x="10" y="52" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#fff">Carbos: <tspan fill="#38bdf8">180g</tspan></text>
      </g>
      <rect x="18" y="245" width="184" height="26" rx="6" fill="#0284c7"/>
      <text x="110" y="262" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="900" fill="#fff">ESCANEAR MACROS</text>
    </g>

    <!-- 5. Front Floating Badges: Finisher & 12 Batidos -->
    <g transform="translate(140, 360)">
      <rect x="0" y="0" width="170" height="110" rx="12" fill="#0b1120" stroke="rgba(16,185,129,0.4)" stroke-width="2"/>
      <text x="85" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="800" fill="#ef4444">BÓNUS TÁCTICO</text>
      <text x="85" y="52" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="900" fill="#fff">FINISHER ABDOMEN</text>
      <text x="85" y="70" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="800" fill="url(#neonM)">DE ACERO (5 MIN)</text>
      <text x="85" y="94" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="url(#goldM)">VALOR: $37 USD (GRATIS)</text>
    </g>

    <g transform="translate(600, 360)">
      <rect x="0" y="0" width="170" height="110" rx="12" fill="#0b1120" stroke="rgba(234,179,8,0.4)" stroke-width="2"/>
      <text x="85" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="800" fill="#eab308">ARSENAL NUTRICIONAL</text>
      <text x="85" y="52" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="900" fill="#fff">12 BATIDOS MILITARES</text>
      <text x="85" y="70" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="800" fill="url(#neonM)">ANABÓLICOS CASEROS</text>
      <text x="85" y="94" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="url(#goldM)">VALOR: $29 USD (GRATIS)</text>
    </g>

    <!-- 6. Guarantee Seal in Front -->
    <g transform="translate(445, 470)">
      <circle cx="0" cy="0" r="42" fill="url(#goldM)"/>
      <circle cx="0" cy="0" r="37" fill="#090d16"/>
      <circle cx="0" cy="0" r="34" fill="#0b1120" stroke="url(#goldM)" stroke-width="1.5"/>
      <text x="0" y="-8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="900" fill="url(#goldM)">GARANTÍA</text>
      <text x="0" y="10" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="900" fill="#fff">7 DÍAS</text>
      <text x="0" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" font-weight="800" fill="#10b981">RIESGO ZERO</text>
    </g>
  </g>
</svg>