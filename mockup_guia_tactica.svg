<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="guideBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="tacticalCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="neonGreenG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="dossierShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="12" dy="24" stdDeviation="24" flood-color="#000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#guideBg)"/>

  <!-- Tactical Hex / Diagonal lines -->
  <path d="M0 80 L800 480 M0 280 L800 680" stroke="rgba(16,185,129,0.05)" stroke-width="2"/>

  <!-- 3D Hardbound Tactical Dossier Binder -->
  <g filter="url(#dossierShadow)" transform="translate(190, 45)">
    <!-- Book Spine -->
    <rect x="0" y="0" width="34" height="510" rx="4" fill="url(#spineGrad)" stroke="#1e293b" stroke-width="1"/>
    <!-- Spine Ribs -->
    <line x1="4" y1="40" x2="30" y2="40" stroke="url(#goldAcc)" stroke-width="2"/>
    <line x1="4" y1="120" x2="30" y2="120" stroke="url(#goldAcc)" stroke-width="2"/>
    <line x1="4" y1="390" x2="30" y2="390" stroke="url(#goldAcc)" stroke-width="2"/>
    <line x1="4" y1="470" x2="30" y2="470" stroke="url(#goldAcc)" stroke-width="2"/>

    <!-- Front Cover -->
    <rect x="34" y="0" width="386" height="510" rx="8" fill="url(#tacticalCover)" stroke="#334155" stroke-width="2"/>

    <!-- Metallic Corner Protectors -->
    <polygon points="34,0 74,0 34,40" fill="url(#goldAcc)"/>
    <polygon points="420,0 380,0 420,40" fill="url(#goldAcc)"/>
    <polygon points="34,510 74,510 34,470" fill="url(#goldAcc)"/>
    <polygon points="420,510 380,510 420,470" fill="url(#goldAcc)"/>

    <!-- Embossed Border -->
    <rect x="54" y="20" width="346" height="470" rx="4" fill="none" stroke="rgba(234,179,8,0.3)" stroke-width="2"/>
    <rect x="62" y="28" width="330" height="454" rx="2" fill="none" stroke="rgba(16,185,129,0.2)" stroke-width="1" stroke-dasharray="8 4"/>

    <!-- Top Classified Stamp -->
    <g transform="translate(227, 65)">
      <rect x="-65" y="-12" width="130" height="24" rx="4" fill="rgba(220,38,38,0.15)" stroke="#ef4444" stroke-width="1.5"/>
      <text x="0" y="4" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" font-weight="900" fill="#f87171" letter-spacing="3">TOP SECRET // ÉLITE</text>
    </g>

    <!-- Military Insignia Emblem in Center -->
    <g transform="translate(227, 150)">
      <circle cx="0" cy="0" r="46" fill="#0b1120" stroke="url(#goldAcc)" stroke-width="2"/>
      <circle cx="0" cy="0" r="40" fill="none" stroke="rgba(16,185,129,0.4)" stroke-width="1" stroke-dasharray="4 2"/>
      <!-- Chevrons -->
      <path d="M-22 -8 L0 10 L22 -8 M-22 -18 L0 0 L22 -18" fill="none" stroke="url(#neonGreenG)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="0" cy="20" r="3" fill="url(#goldAcc)"/>
    </g>

    <!-- Main Typography -->
    <text x="227" y="240" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="800" fill="#10b981" letter-spacing="3">SISTEMA OPERATIVO DE COMBATE</text>
    <text x="227" y="275" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="23" font-weight="900" fill="#ffffff" letter-spacing="0.5">GUÍA TÁCTICA</text>
    <text x="227" y="302" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="900" fill="url(#goldAcc)" letter-spacing="1">DE OPERACIONES</text>
    <text x="227" y="324" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="800" fill="#94a3b8" letter-spacing="1">BIOMECÁNICAS</text>

    <line x1="127" y1="344" x2="327" y2="344" stroke="url(#goldAcc)" stroke-width="1.5"/>

    <!-- Key Bullets inside Dossier -->
    <text x="227" y="375" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">• MAPAS DE TENSIÓN MUSCULAR</text>
    <text x="227" y="398" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">• PROGRESIONES DE CHOQUE 21 DÍAS</text>
    <text x="227" y="421" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">• ADAPTACIONES ARTICULARES ZERO-EQUIPO</text>

    <!-- Bottom Official Ribbon -->
    <g transform="translate(227, 460)">
      <rect x="-100" y="-12" width="200" height="24" rx="12" fill="url(#neonGreenG)"/>
      <text x="0" y="4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="#022c22" letter-spacing="1">EDICIÓN OFICIAL ILIMITADA</text>
    </g>
  </g>
</svg>
