<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Gold Metallic Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#eab308"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="75%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Emerald Glow Gradients -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="diplomaShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.6"/>
    </filter>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>

  <!-- Subtle Tactical Grid Lines -->
  <path d="M0 100 H800 M0 200 H800 M0 300 H800 M0 400 H800 M0 500 H800 M100 0 V600 M200 0 V600 M300 0 V600 M400 0 V600 M500 0 V600 M600 0 V600 M700 0 V600" stroke="rgba(16,185,129,0.04)" stroke-width="1"/>

  <!-- Certificate Sheet (Angled 3D Clipboard Card) -->
  <g filter="url(#diplomaShadow)" transform="translate(60, 40)">
    <!-- Base Paper -->
    <rect x="0" y="0" width="680" height="520" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="2"/>
    
    <!-- Outer Ornamental Border (Gold) -->
    <rect x="16" y="16" width="648" height="488" rx="4" fill="none" stroke="url(#goldBorder)" stroke-width="2.5"/>
    
    <!-- Inner Fine Border -->
    <rect x="24" y="24" width="632" height="472" rx="2" fill="none" stroke="rgba(234,179,8,0.3)" stroke-width="1" stroke-dasharray="6 3"/>

    <!-- Corner Military Accents -->
    <!-- Top-Left -->
    <path d="M16 46 L46 16 M16 56 L56 16 M20 20 L35 20 L20 35 Z" fill="url(#goldGrad)" opacity="0.8"/>
    <!-- Top-Right -->
    <path d="M664 46 L634 16 M664 56 L624 16 M660 20 L645 20 L660 35 Z" fill="url(#goldGrad)" opacity="0.8"/>
    <!-- Bottom-Left -->
    <path d="M16 474 L46 504 M16 464 L56 504 M20 500 L35 500 L20 485 Z" fill="url(#goldGrad)" opacity="0.8"/>
    <!-- Bottom-Right -->
    <path d="M664 474 L634 504 M664 464 L624 504 M660 500 L645 500 L660 485 Z" fill="url(#goldGrad)" opacity="0.8"/>

    <!-- Top Header: Military Insignia Icon -->
    <g transform="translate(340, 50)">
      <!-- Shield / Chevron -->
      <polygon points="0,-16 18,2 0,20 -18,2" fill="url(#emeraldGrad)"/>
      <polygon points="0,-10 12,3 0,16 -12,3" fill="#0b1120"/>
      <!-- Stars -->
      <circle cx="-32" cy="0" r="3" fill="url(#goldGrad)"/>
      <circle cx="32" cy="0" r="3" fill="url(#goldGrad)"/>
    </g>

    <!-- Organization Name -->
    <text x="340" y="90" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="800" fill="#10b981" letter-spacing="4">DIVISIÓN TÁCTICA DE OPERACIONES ESPECIALES</text>

    <!-- Main Title -->
    <text x="340" y="132" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="24" font-weight="900" fill="url(#goldGrad)" letter-spacing="1">CERTIFICADO DE GRADUACIÓN</text>
    <text x="340" y="156" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" letter-spacing="3">Y APTITUD TÁCTICA MILITAR</text>

    <!-- Separator -->
    <line x1="220" y1="172" x2="460" y2="172" stroke="url(#goldBorder)" stroke-width="1.5"/>

    <!-- Body Text -->
    <text x="340" y="206" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-style="italic" fill="#94a3b8">Se otorga con honor y distinción al alumno por haber superado satisfactoriamente los</text>
    <text x="340" y="234" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff" letter-spacing="0.5">21 DÍAS DEL PROTOCOLO DE CALISTENIA MILITAR</text>
    <text x="340" y="260" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" fill="#94a3b8">Demostrando máxima disciplina física, reactivación neuromuscular de fibras tipo II,</text>
    <text x="340" y="280" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" fill="#94a3b8">eliminación de grasa visceral y dominio biomecánico con peso corporal.</text>

    <!-- Stats & Skills Badges -->
    <g transform="translate(100, 310)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="140" height="42" rx="6" fill="#111827" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
      <text x="70" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#10b981">RANGO ALCANZADO</text>
      <text x="70" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff">SARGENTO TÁCTICO</text>

      <!-- Badge 2 -->
      <rect x="170" y="0" width="140" height="42" rx="6" fill="#111827" stroke="rgba(234,179,8,0.3)" stroke-width="1"/>
      <text x="240" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#eab308">HORAS COMPLETADAS</text>
      <text x="240" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff">21/21 MISIONES</text>

      <!-- Badge 3 -->
      <rect x="340" y="0" width="140" height="42" rx="6" fill="#111827" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
      <text x="410" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#10b981">ESTADO BIOMÉTRICO</text>
      <text x="410" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff">100% APTO TÁCTICO</text>
    </g>

    <!-- Wax Seal (Right Side) -->
    <g transform="translate(540, 410)" filter="url(#diplomaShadow)">
      <!-- Seal Outer Scallop -->
      <circle cx="0" cy="0" r="42" fill="url(#goldGrad)"/>
      <circle cx="0" cy="0" r="37" fill="#854d0e"/>
      <circle cx="0" cy="0" r="34" fill="url(#goldGrad)"/>
      <!-- Star in Seal -->
      <polygon points="0,-18 5,-5 18,-5 8,4 12,17 0,9 -12,17 -8,4 -18,-5 -5,-5" fill="#ca8a04"/>
      <text x="0" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" font-weight="900" fill="#713f12" letter-spacing="1">OFICIAL</text>
    </g>

    <!-- Signatures & Serial (Left & Center) -->
    <g transform="translate(60, 420)">
      <!-- Signature Line -->
      <line x1="0" y1="20" x2="160" y2="20" stroke="#475569" stroke-width="1.5"/>
      <path d="M20 16 Q 40 0, 60 14 T 100 5 T 140 18" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
      <text x="80" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#94a3b8">Cmdte. Biomecánica Táctica</text>
      <text x="80" y="47" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">Instructor Jefe de Calistenia</text>

      <!-- Official Serial -->
      <g transform="translate(200, 10)">
        <text x="70" y="12" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" font-weight="700" fill="#10b981">ID: #PCM-2026-VIP-OFICIAL</text>
        <text x="70" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">Verificación Criptográfica Segura</text>
      </g>
    </g>
  </g>
</svg>
